version: 1.0
runtime: python3
run:
  runtime-version: 3.10
  command: uvicorn app:app --host 0.0.0.0 --port 8000 --workers 1
  network:
    port: 8000
  env:
    - name: LOG_TARGET
      value: "cloud"
    - name: ENVIRONMENT
      value: "production"
    - name: CORS_ALLOWED_ORIGINS
      value: "*"
